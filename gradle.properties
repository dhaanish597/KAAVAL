# VAAKKU Gradle settings.
#
# Deliberately few knobs: this machine has to build on venue Wi-Fi (or with the
# network entirely down), so the fewer moving parts the better.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is left off on purpose. The checkBannedWords task and the
# manifest check both read the tree at execution time; a cache miss that
# silently reuses a stale result would break the "evidence or it didn't happen"
# rule (CLAUDE.md #7) by letting a guard pass without having re-run.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
